# Runs every solution snapshot's tests: the course tests (all offline: scripted models, fake fetch,
# local child processes) plus the snapshot's own tests. No Ollama needed.
name: course tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.snapshot }} · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        snapshot: [checkpoint-1, checkpoint-2, checkpoint-3, final]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: node --test
        working-directory: solutions/${{ matrix.snapshot }}
        run: node --test
